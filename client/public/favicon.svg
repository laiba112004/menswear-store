<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C768"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#9A7712"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </linearGradient>
  </defs>

  <!-- Deep Soft Black Rounded Badge with Gold Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Subtle Inner Framing Line -->
  <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="#2B2B2B" stroke-width="1"/>

  <!-- Bold Luxury Serif "A" Monogram for ATELIER -->
  <path d="M 32 12 L 46 48 L 40 48 L 36.5 38.5 L 27.5 38.5 L 24 48 L 18 48 Z M 32 23 L 29 33.5 L 35 33.5 Z" fill="#FFFFFF"/>
  
  <!-- Red Accent Bar under Monogram -->
  <line x1="26" y1="36" x2="38" y2="36" stroke="#C8102E" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Collegiate Gold Dot Accent -->
  <circle cx="32" cy="11.5" r="1.8" fill="url(#goldGrad)"/>
</svg>